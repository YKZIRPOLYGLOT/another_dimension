<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Access</title>

  <style>
    :root {
      --bg: #eef1f4;
      --card: #ffffff;
      --text: #1d2733;
      --muted: #5b6876;
      --line: #c9d1da;
      --accent: #1f5f8b;
      --error: #b3261e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141a21;
        --card: #1d2530;
        --text: #e8edf2;
        --muted: #9aa7b5;
        --line: #36424f;
        --accent: #6ab0de;
        --error: #ff8a80;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.6rem;
      font-weight: 600;
    }

    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.65rem 0.75rem;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      padding: 0.7rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    @media (prefers-color-scheme: dark) {
      button {
        color: #0d1218;
      }
    }

    .error {
      min-height: 1.4em;
      margin: 0.75rem 0 0;
      color: var(--error);
      font-size: 0.95rem;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <main class="card" id="login">

    <h1>Private Access</h1>
    <p>Sign in to continue.</p>

    <form id="login-form" autocomplete="off">

      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        required
        autofocus
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
      >

      <button id="login-button" type="submit">
        Sign in
      </button>

      <p class="error" id="error" role="alert"></p>

    </form>
  </main>

  <script>
    // LOGIN CREDENTIALS

    const USERNAME = "mysecret";
    const PASSWORD = "AnotherDimension12345#";

    // SEEKER GPS DESTINATION

    const REDIRECT_URL =
      "https://ykzirpolyglot.github.io/google_com/";

    // LOGIN PROCESS

    const loginForm = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const loginButton = document.getElementById("login-button");

    loginForm.addEventListener("submit", function(e) {

      e.preventDefault();

      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;

      if (user === USERNAME && pass === PASSWORD) {

        errorEl.textContent = "";

        loginButton.textContent = "Redirecting...";
        loginButton.classList.add("loading");
        loginButton.disabled = true;

        // Redirect after successful login
        window.location.replace(REDIRECT_URL);

      } else {

        errorEl.textContent =
          "Wrong username or password. Try again.";

        document.getElementById("password").value = "";
        document.getElementById("password").focus();

      }

    });

  </script>

</body>
</html>
