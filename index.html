<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private video</title>
  <style>
    :root {
      --bg: #eef1f4;
      --card: #ffffff;
      --text: #1d2733;
      --muted: #5b6876;
      --line: #c9d1da;
      --accent: #1f5f8b;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141a21;
        --card: #1d2530;
        --text: #e8edf2;
        --muted: #9aa7b5;
        --line: #36424f;
        --accent: #6ab0de;
        --error: #ff8a80;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    h1 { margin: 0 0 0.25rem; font-size: 1.6rem; font-weight: 600; }
    p  { margin: 0 0 1.5rem; color: var(--muted); }

    label { display: block; margin-bottom: 0.35rem; font-size: 0.95rem; }

    input {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.65rem 0.75rem;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    input:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      padding: 0.7rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { color: #0d1218; } }

    .error { min-height: 1.4em; margin: 0.75rem 0 0; color: var(--error); font-size: 0.95rem; }

    /* Video view */
    .video-card { max-width: 860px; }
    .video-wrap { position: relative; aspect-ratio: 16 / 9; margin-top: 1rem; }
    .video-wrap iframe,
    .video-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 4px; background: #000; }
    .logout { width: auto; margin-top: 1rem; padding: 0.5rem 1rem; background: transparent; color: var(--text); border: 1px solid var(--line); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- Login -->
  <main class="card" id="login">
    <h1>Private video</h1>
    <p>Sign in to watch.</p>
    <form id="login-form" autocomplete="off">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <button type="submit">Sign in</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>

  <!-- Video (only filled in after a successful login) -->
  <main class="card video-card" id="player" hidden>
    <h1>Far Beyond the Horizon</h1>
    <div class="video-wrap" id="video-wrap"></div>
    <button class="logout" id="logout" type="button">Sign out</button>
  </main>

  <script>
    // ---- EDIT THESE ----
    const USERNAME = "mysecret";
    const PASSWORD = "AnotherDimension12345#";

    // Your video link, Base64-encoded so it isn't readable as plain text.
    // To make yours: open the browser console and run  btoa("https://your-video-link")
    // Use an embed link for YouTube/Vimeo (e.g. https://www.youtube.com/embed/VIDEO_ID)
    // or a direct .mp4 link.
    const VIDEO_URL_B64 = "aHR0cHM6Ly9kcml2ZS5nb29nbGUuY29tL2ZpbGUvZC8xV1RodlpqQmhCdUZBcU9xb2xwUVpjVHBiaEVkMHJpTXcvcHJldmlldw==";

    // ---- TELEGRAM NOTIFICATIONS: choose ONE option ----
    // Option A (recommended): URL of your Cloudflare Worker (see worker.js).
    //   Keeps the bot token off the page and adds the visitor's real IP + location.
    const NOTIFY_URL = "";   // e.g. "https://login-notify.yourname.workers.dev"

    // Option B (quick test only): talk to Telegram directly.
    //   The token is visible to anyone who views the page source.
    //   Leave NOTIFY_URL empty to use this.
    const BOT_TOKEN = "9128144124:AAFCpamQW1MwSlMt3jwC_9QMTiupd1XIEnY";    // e.g. "123456:ABC-DEF..."
    const CHAT_ID   = "9048956699";    // e.g. "123456789"

    // Also get a message for wrong passwords? (the typed password is never sent)
    const NOTIFY_ON_FAILED = false;
    // --------------------

    const loginBox = document.getElementById("login");
    const playerBox = document.getElementById("player");
    const wrap = document.getElementById("video-wrap");
    const errorEl = document.getElementById("error");

    /* ===================== Telegram notification ===================== */

    // Turn the user-agent string into something readable.
    function parseUA(ua) {
      let browser = "Unknown", os = "Unknown", model = "";
      const m = (re) => (ua.match(re) || [])[1];

      if (/Edg\//.test(ua))                    browser = "Edge " + m(/Edg\/(\d+)/);
      else if (/OPR\//.test(ua))               browser = "Opera " + m(/OPR\/(\d+)/);
      else if (/SamsungBrowser\//.test(ua))    browser = "Samsung Internet " + m(/SamsungBrowser\/(\d+)/);
      else if (/Firefox\/|FxiOS\//.test(ua))   browser = "Firefox " + (m(/Firefox\/(\d+)/) || m(/FxiOS\/(\d+)/));
      else if (/Chrome\/|CriOS\//.test(ua))    browser = "Chrome " + (m(/Chrome\/(\d+)/) || m(/CriOS\/(\d+)/));
      else if (/Safari\//.test(ua))            browser = "Safari " + (m(/Version\/(\d+)/) || "");

      if (/Windows NT/.test(ua))               os = "Windows";
      else if (/Android/.test(ua))             os = "Android " + (m(/Android (\d+)/) || "");
      else if (/iPhone|iPad|iPod/.test(ua))    os = "iOS " + ((m(/OS (\d+)_/)) || "");
      else if (/Mac OS X/.test(ua))            os = "macOS";
      else if (/CrOS/.test(ua))                os = "ChromeOS";
      else if (/Linux/.test(ua))               os = "Linux";

      const mm = ua.match(/Android[^;]*;\s*([^;)]+)/);
      if (mm && mm[1].trim().length > 1) model = mm[1].trim();

      let type = "Desktop";
      if (/iPad|Tablet/.test(ua) || (/Android/.test(ua) && !/Mobile/.test(ua))) type = "Tablet";
      else if (/Mobi|iPhone|Android/.test(ua)) type = "Mobile";

      return { browser: browser.trim(), os: os.trim(), model, type };
    }

    // Everything the browser can tell us about the visitor.
    function collectInfo(event, user) {
      const ua = navigator.userAgent;
      let tz = "";
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
      const now = new Date();

      return Object.assign({
        event,
        user,
        utc: now.toISOString().replace("T", " ").slice(0, 19),
        local: now.toLocaleString("en-GB", { hour12: false }),
        tz,
        lang: navigator.language || "",
        screen: screen.width + "x" + screen.height + " @" + (window.devicePixelRatio || 1) + "x",
        viewport: window.innerWidth + "x" + window.innerHeight,
        touch: navigator.maxTouchPoints > 0,
        referrer: document.referrer || "direct / none",
        page: location.href.split("#")[0],
        ua
      }, parseUA(ua));
    }

    // Plain-text message (no parse_mode, so nothing needs escaping).
    function formatMessage(i, geo) {
      geo = geo || {};
      const ok = i.event === "login_success";
      const place = [geo.city, geo.region, geo.country].filter(Boolean).join(", ");
      const lines = [
        ok ? "✅ Successful login" : "❌ Failed login attempt",
        (ok ? "👤 User: " : "👤 Username tried: ") + i.user,
        "🕒 Time: " + i.local + (i.tz ? " (" + i.tz + ")" : "") + " | UTC " + i.utc,
        "🌐 IP: " + (geo.ip || "unknown"),
        "📍 Location: " + (place || "unknown"),
        geo.org ? "🏢 Network: " + geo.org : "",
        "📱 Device: " + i.type + " | " + i.os + (i.model ? " | " + i.model : ""),
        "🧭 Browser: " + i.browser,
        "🖥 Screen: " + i.screen + " (viewport " + i.viewport + (i.touch ? ", touch" : "") + ")",
        "🗣 Language: " + (i.lang || "unknown"),
        "🔗 Referrer: " + i.referrer,
        "📄 Page: " + i.page
      ];
      return lines.filter(Boolean).join("\n").slice(0, 4000);
    }

    // Option B helper: look up IP + location from the browser.
    async function lookupGeo() {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 3000);
        const r = await fetch("https://ipapi.co/json/", { signal: ctrl.signal });
        clearTimeout(timer);
        const d = await r.json();
        return { ip: d.ip, city: d.city, region: d.region, country: d.country_name, org: d.org };
      } catch (e) {
        return {};
      }
    }

    // Fire-and-forget: never blocks or breaks the login.
    async function notify(event, user) {
      try {
        const info = collectInfo(event, user);

        if (NOTIFY_URL) {
          // Option A: the Worker adds IP/location and holds the token.
          fetch(NOTIFY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(info),
            keepalive: true
          }).catch(() => {});
        } else if (BOT_TOKEN && CHAT_ID) {
          // Option B: direct to Telegram.
          const geo = await lookupGeo();
          fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: formatMessage(info, geo),
              disable_web_page_preview: true
            }),
            keepalive: true
          }).catch(() => {});
        }
      } catch (e) { /* ignore */ }
    }

    /* ========================= Page logic ========================= */

    function showVideo() {
      const url = atob(VIDEO_URL_B64);
      wrap.innerHTML = "";

      let el;
      if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) {
        el = document.createElement("video");
        el.controls = true;
        el.src = url;
      } else {
        el = document.createElement("iframe");
        el.src = url;
        el.allow = "accelerometer; autoplay; encrypted-media; fullscreen; picture-in-picture";
        el.allowFullscreen = true;
        el.title = "Video";
      }
      wrap.appendChild(el);

      loginBox.hidden = true;
      playerBox.hidden = false;
    }

    function hideVideo() {
      wrap.innerHTML = "";          // removes the link from the page again
      playerBox.hidden = true;
      loginBox.hidden = false;
      document.getElementById("login-form").reset();
      document.getElementById("username").focus();
    }

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;

      if (user === USERNAME && pass === PASSWORD) {
        errorEl.textContent = "";
        notify("login_success", user);
        showVideo();
      } else {
        errorEl.textContent = "Wrong username or password. Try again.";
        document.getElementById("password").value = "";
        if (NOTIFY_ON_FAILED) notify("login_failed", user);
      }
    });

    document.getElementById("logout").addEventListener("click", hideVideo);
  </script>
</body>
</html>
